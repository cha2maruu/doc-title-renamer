[project]
name = "doc-title-renamer"
version = "0.1.0"
description = "docx/xlsx/pptx/PDFの内容を要約し、日付とタイトルでファイル名・フォルダを自動整理するCLIツール"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "markitdown[docx,xlsx,pptx,pdf]",
    "docling",
    "easyocr",
    "pypdfium2!=4.30.1,<6.0.0,>=4.30.0",
]
# NOTE: docling / easyocr are still used by ocr.py (scanned-PDF OCR path) and
# will be removed once that path is migrated to RapidOCR (TASK.md step 3-4).

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
doc-title-renamer = "doc_title_renamer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_title_renamer"]
